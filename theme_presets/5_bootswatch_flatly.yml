# Preset 5: Bootswatch Flatly Theme
site_name: Full-Field LED Visual Stimulator
site_description: High-precision temporal visual stimulation platform for neuroscience and psychophysics.
site_author: Saleem Lab
repo_url: https://github.com/SaleemLab/LEDStimulation
repo_name: SaleemLab/LEDStimulation

theme:
  name: flatly

markdown_extensions:
  - admonition
  - tables
  - attr_list

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - javascripts/katex.js

nav:
  - Overview: index.md
  - 1. Hardware:
      - Circuit & Driver: 1-hardware/circuit-and-driver.md
      - Custom PCBs: 1-hardware/custom-pcbs.md
      - Enclosure & Optics:
          - Panel Enclosure: 1-hardware/enclosure-and-optics/panel-enclosure.md
          - Wearable Glasses: 1-hardware/enclosure-and-optics/wearable-glasses.md
      - Bill of Materials: 1-hardware/bill-of-materials.md
  - 2. Firmware:
      - Architecture & Timers: 2-firmware/architecture-and-timers.md
      - Serial API Reference: 2-firmware/serial-api-reference.md
      - Firmware Variants: 2-firmware/firmware-variants.md
  - 3. Calibration:
      - Calibration Guide: 3-calibration/calibration-guide.md
      - Gamma LUT Pipeline: 3-calibration/gamma-lut-pipeline.md
      - Photoreceptor Calculations: 3-calibration/photoreceptor-calculations.md
  - 4. Experimental Workflows:
      - Bonsai Overview: 4-experimental-workflows/bonsai-overview.md
      - Stimulation Paradigms: 4-experimental-workflows/stimulation-paradigms.md
      - Integration & Sync: 4-experimental-workflows/integration-and-sync.md
  - 5. Reference:
      - Performance & Dynamics: 5-reference/performance-and-sync.md
