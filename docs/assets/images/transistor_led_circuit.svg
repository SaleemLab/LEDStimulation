<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" width="100%" height="100%">
  <defs>
    <!-- Simple Arrowheads -->
    <marker id="arr2" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Clean Canvas -->
  <rect width="650" height="450" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <g stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- ================== +12V POWER RAIL ================== -->
    <!-- +12V Terminal -->
    <circle cx="410" cy="25" r="4" fill="#ffffff"/>
    <line x1="410" y1="29" x2="410" y2="65"/>
    
    <!-- Top +12V Bus Line -->
    <line x1="330" y1="65" x2="490" y2="65"/>
    <circle cx="330" cy="65" r="3" fill="#0f172a"/>
    <circle cx="490" cy="65" r="3" fill="#0f172a"/>

    <!-- ================== LINE 1 (x = 330) ================== -->
    <!-- Wire from Bus to LED 1.1 -->
    <line x1="330" y1="65" x2="330" y2="85"/>
    
    <!-- LED 1.1 -->
    <g transform="translate(330, 85)">
      <polygon points="-10,0 10,0 0,14" fill="#0f172a"/>
      <line x1="-10" y1="14" x2="10" y2="14"/>
      <line x1="8" y1="5" x2="17" y2="12" marker-end="url(#arr2)"/>
      <line x1="8" y1="10" x2="17" y2="17" marker-end="url(#arr2)"/>
    </g>
    <!-- Wire between LED 1.1 and LED 1.2 -->
    <line x1="330" y1="99" x2="330" y2="115"/>

    <!-- LED 1.2 -->
    <g transform="translate(330, 115)">
      <polygon points="-10,0 10,0 0,14" fill="#0f172a"/>
      <line x1="-10" y1="14" x2="10" y2="14"/>
      <line x1="8" y1="5" x2="17" y2="12" marker-end="url(#arr2)"/>
      <line x1="8" y1="10" x2="17" y2="17" marker-end="url(#arr2)"/>
    </g>
    <!-- Wire between LED 1.2 and LED 1.3 -->
    <line x1="330" y1="129" x2="330" y2="145"/>

    <!-- LED 1.3 -->
    <g transform="translate(330, 145)">
      <polygon points="-10,0 10,0 0,14" fill="#0f172a"/>
      <line x1="-10" y1="14" x2="10" y2="14"/>
      <line x1="8" y1="5" x2="17" y2="12" marker-end="url(#arr2)"/>
      <line x1="8" y1="10" x2="17" y2="17" marker-end="url(#arr2)"/>
    </g>
    <!-- Wire between LED 1.3 and R_fixed 1 -->
    <line x1="330" y1="159" x2="330" y2="175"/>

    <!-- R_fixed 1 (Vertical Zig-zag) -->
    <path d="M 330 175 L 330 180 L 322 185 L 338 191 L 322 197 L 338 203 L 322 209 L 330 214 L 330 219"/>
    <!-- Wire from R_fixed 1 to Merge Bus -->
    <line x1="330" y1="219" x2="330" y2="240"/>


    <!-- ================== LINE 2 (x = 490) ================== -->
    <!-- Wire from Bus to LED 2.1 -->
    <line x1="490" y1="65" x2="490" y2="85"/>
    
    <!-- LED 2.1 -->
    <g transform="translate(490, 85)">
      <polygon points="-10,0 10,0 0,14" fill="#0f172a"/>
      <line x1="-10" y1="14" x2="10" y2="14"/>
      <line x1="8" y1="5" x2="17" y2="12" marker-end="url(#arr2)"/>
      <line x1="8" y1="10" x2="17" y2="17" marker-end="url(#arr2)"/>
    </g>
    <!-- Wire between LED 2.1 and LED 2.2 -->
    <line x1="490" y1="99" x2="490" y2="115"/>

    <!-- LED 2.2 -->
    <g transform="translate(490, 115)">
      <polygon points="-10,0 10,0 0,14" fill="#0f172a"/>
      <line x1="-10" y1="14" x2="10" y2="14"/>
      <line x1="8" y1="5" x2="17" y2="12" marker-end="url(#arr2)"/>
      <line x1="8" y1="10" x2="17" y2="17" marker-end="url(#arr2)"/>
    </g>
    <!-- Wire between LED 2.2 and LED 2.3 -->
    <line x1="490" y1="129" x2="490" y2="145"/>

    <!-- LED 2.3 -->
    <g transform="translate(490, 145)">
      <polygon points="-10,0 10,0 0,14" fill="#0f172a"/>
      <line x1="-10" y1="14" x2="10" y2="14"/>
      <line x1="8" y1="5" x2="17" y2="12" marker-end="url(#arr2)"/>
      <line x1="8" y1="10" x2="17" y2="17" marker-end="url(#arr2)"/>
    </g>
    <!-- Wire between LED 2.3 and R_fixed 2 -->
    <line x1="490" y1="159" x2="490" y2="175"/>

    <!-- R_fixed 2 (Vertical Zig-zag) -->
    <path d="M 490 175 L 490 180 L 482 185 L 498 191 L 482 197 L 498 203 L 482 209 L 490 214 L 490 219"/>
    <!-- Wire from R_fixed 2 to Merge Bus -->
    <line x1="490" y1="219" x2="490" y2="240"/>


    <!-- ================== MERGING BUS & MASTER CERMET TRIMPOT ================== -->
    <!-- Merge Bus -->
    <line x1="330" y1="240" x2="490" y2="240"/>
    <circle cx="330" cy="240" r="3" fill="#0f172a"/>
    <circle cx="490" cy="240" r="3" fill="#0f172a"/>
    <circle cx="410" cy="240" r="3" fill="#0f172a"/>

    <!-- Wire from Merge Bus to Shared R_var -->
    <line x1="410" y1="240" x2="410" y2="258"/>

    <!-- Master R_var / Cermet Trimpot (Zig-zag with diagonal arrow) -->
    <path d="M 410 258 L 410 263 L 402 268 L 418 274 L 402 280 L 418 286 L 402 292 L 410 297 L 410 302"/>
    <line x1="386" y1="302" x2="432" y2="268" marker-end="url(#arr2)"/>

    <!-- Wire from R_var to NPN Collector -->
    <line x1="410" y1="302" x2="410" y2="330"/>


    <!-- ================== NPN TRANSISTOR ================== -->
    <!-- Transistor outer circle -->
    <circle cx="402" cy="348" r="18" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Base Bar (thick vertical line) -->
    <line x1="394" y1="338" x2="394" y2="358" stroke-width="3"/>
    <!-- Base lead -->
    <line x1="280" y1="348" x2="394" y2="348"/>

    <!-- Collector Slanted Line -->
    <line x1="394" y1="341" x2="410" y2="330"/>

    <!-- Emitter Slanted Line with Outward Arrow -->
    <line x1="394" y1="355" x2="410" y2="366"/>
    <polygon points="408,365 401,358 406,356" fill="#0f172a"/>
    
    <!-- Wire from Emitter to Ground -->
    <line x1="410" y1="366" x2="410" y2="395"/>


    <!-- ================== PWM INPUT & BASE RESISTOR (CLOSE TO TRANSISTOR) ================== -->
    <!-- PWM Input Terminal -->
    <circle cx="85" cy="348" r="4" fill="#ffffff"/>
    <line x1="89" y1="348" x2="125" y2="348"/>

    <!-- Base Resistor R_base (Horizontal Zig-zag) -->
    <path d="M 125 348 L 131 348 L 137 338 L 149 358 L 161 338 L 173 358 L 185 338 L 191 348 L 198 348"/>

    <!-- Wire from R_base to Pull-down node and Transistor Base -->
    <line x1="198" y1="348" x2="280" y2="348"/>

    <!-- Pull-Down Resistor Node at x=235 -->
    <circle cx="235" cy="348" r="3" fill="#0f172a"/>
    
    <!-- Wire from Node to Pull-Down Resistor -->
    <line x1="235" y1="348" x2="235" y2="358"/>

    <!-- Pull-Down Resistor (Vertical Zig-zag) -->
    <path d="M 235 358 L 235 363 L 227 368 L 243 373 L 227 378 L 243 383 L 227 388 L 235 392 L 235 397"/>
    
    <!-- Wire from Pull-Down to Ground -->
    <line x1="235" y1="397" x2="235" y2="408"/>
    
    <!-- Pull-Down Ground -->
    <line x1="225" y1="408" x2="245" y2="408"/>
    <line x1="229" y1="412" x2="241" y2="412"/>
    <line x1="233" y1="416" x2="237" y2="416"/>


    <!-- ================== COMMON GROUND ================== -->
    <line x1="395" y1="395" x2="425" y2="395"/>
    <line x1="400" y1="399" x2="420" y2="399"/>
    <line x1="405" y1="403" x2="415" y2="403"/>
  </g>


  <!-- ================== LABELS & ANNOTATIONS ================== -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#0f172a">
    <!-- +12V Power -->
    <text x="428" y="29" font-size="13" font-weight="700">+12V Supply</text>

    <!-- Branch Labels -->
    <text x="330" y="52" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Line 1</text>
    <text x="490" y="52" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Line 2 (…N)</text>

    <!-- 3x LEDs annotation -->
    <text x="545" y="125" font-size="11" font-weight="600">LED Load</text>
    <text x="545" y="139" font-size="9" fill="#64748b">(3× LEDs per line)</text>

    <!-- R_fixed annotations -->
    <text x="250" y="196" font-size="11" font-weight="600" text-anchor="middle">R<tspan dy="2" font-size="8">fixed, 1</tspan></text>
    <text x="250" y="210" font-size="9" fill="#64748b" text-anchor="middle">Current Limiter</text>

    <text x="570" y="196" font-size="11" font-weight="600" text-anchor="middle">R<tspan dy="2" font-size="8">fixed, 2</tspan></text>
    <text x="570" y="210" font-size="9" fill="#64748b" text-anchor="middle">Current Limiter</text>

    <!-- Shared Cermet Trimpot -->
    <text x="440" y="276" font-size="11" font-weight="600">R<tspan dy="2" font-size="8">var</tspan></text>
    <text x="440" y="291" font-size="9" fill="#64748b">Cermet Trimpot (All lines)</text>

    <!-- Transistor -->
    <text x="435" y="344" font-size="11" font-weight="600">NPN Transistor</text>
    <text x="435" y="357" font-size="9" fill="#64748b">e.g. 2N3904 (40V, 200mA)</text>
    <text x="435" y="369" font-size="8" fill="#64748b">Low-Side Switch</text>

    <!-- PWM Input -->
    <text x="85" y="326" font-size="12" font-weight="600" text-anchor="middle">PWM Source</text>

    <!-- Base Resistor -->
    <text x="162" y="326" font-size="11" font-weight="600" text-anchor="middle">R<tspan dy="2" font-size="8">base</tspan></text>
    <text x="162" y="374" font-size="9" fill="#64748b" text-anchor="middle">100 Ω (e.g.)</text>

    <!-- Pull Down Resistor -->
    <text x="270" y="380" font-size="10" font-weight="600">R<tspan dy="2" font-size="7">pull-down</tspan></text>
    <text x="270" y="394" font-size="9" fill="#64748b">10 kΩ (e.g.)</text>

    <!-- Ground Label -->
    <text x="410" y="418" font-size="10" font-weight="600" text-anchor="middle">Common GND</text>
  </g>
</svg>
