<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 16px; }
    .icon-bg { fill: #fdf4ff; stroke: #f0abfc; stroke-width: 1.5; }
    .tag-bg { fill: #fae8ff; rx: 6px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #a21caf; letter-spacing: 0.08em; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    .source-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
    .source-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #64748b; }
    .source-highlight { fill: #c026d3; font-weight: 600; }
  </style>

  <!-- Card Background -->
  <rect x="15" y="15" width="770" height="390" class="bg" filter="url(#shadow)" />

  <!-- Badge -->
  <g transform="translate(325, 45)">
    <rect width="150" height="26" class="tag-bg"/>
    <text x="75" y="17" text-anchor="middle" class="tag-text">IMAGE PLACEHOLDER</text>
  </g>

  <!-- Central Icon: Glasses Frame + Boom Arm + LED Diffuser -->
  <g transform="translate(300, 95)">
    <!-- Neon Glasses Frame Outline -->
    <!-- Left Rim -->
    <rect x="20" y="30" width="65" height="50" rx="15" fill="none" stroke="#1e293b" stroke-width="4"/>
    <!-- Right Rim -->
    <rect x="115" y="30" width="65" height="50" rx="15" fill="none" stroke="#1e293b" stroke-width="4"/>
    <!-- Bridge -->
    <path d="M 85 45 Q 100 35 115 45" fill="none" stroke="#1e293b" stroke-width="4"/>
    <!-- Temples -->
    <path d="M 20 40 L -20 30" fill="none" stroke="#1e293b" stroke-width="3"/>
    <path d="M 180 40 L 220 30" fill="none" stroke="#1e293b" stroke-width="3"/>

    <!-- Eye Tracker Cameras (Pupil Labs Neon) -->
    <circle cx="35" cy="70" r="4" fill="#0284c7"/>
    <circle cx="165" cy="70" r="4" fill="#0284c7"/>

    <!-- 3D Printed Boom Arm Attached to Left Frame -->
    <path d="M 10 38 L -15 42 L -15 80 L 15 85" fill="none" stroke="#c026d3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Miniature Diffuser Housing & LED Assembly -->
    <rect x="15" y="70" width="30" height="30" rx="6" fill="#f0abfc" stroke="#c026d3" stroke-width="2"/>
    <circle cx="30" cy="85" r="7" fill="#fbbf24" opacity="0.9"/>
    
    <!-- Light Glow Ray -->
    <path d="M 37 80 L 52 75 M 37 85 L 55 85 M 37 90 L 52 95" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="400" y="260" text-anchor="middle" class="title">Wearable Glasses Assembly (Pupil Labs Neon Integration)</text>
  <text x="400" y="288" text-anchor="middle" class="subtitle">Photograph / 3D CAD Assembly of Glasses Frame, Boom Arm &amp; Mounted LED Diffuser</text>

  <!-- Source Reference Box -->
  <g transform="translate(150, 325)">
    <rect width="500" height="42" class="source-box"/>
    <text x="250" y="26" text-anchor="middle" class="source-text">Target asset: <tspan class="source-highlight">Hardware/glasses/boom_arm.stl</tspan> mounted on Neon frame</text>
  </g>
</svg>
