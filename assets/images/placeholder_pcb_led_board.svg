<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 16px; }
    .icon-bg { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .icon-primary { stroke: #2563eb; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon-fill { fill: #3b82f6; }
    .tag-bg { fill: #dbeafe; rx: 6px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1e40af; letter-spacing: 0.08em; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    .source-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
    .source-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #64748b; }
    .source-highlight { fill: #2563eb; font-weight: 600; }
  </style>

  <!-- Card Background -->
  <rect x="15" y="15" width="770" height="390" class="bg" filter="url(#shadow)" />

  <!-- Badge -->
  <g transform="translate(325, 45)">
    <rect width="150" height="26" class="tag-bg"/>
    <text x="75" y="17" text-anchor="middle" class="tag-text">IMAGE PLACEHOLDER</text>
  </g>

  <!-- Central Icon: PCB / Board Wireframe -->
  <g transform="translate(350, 95)">
    <rect x="-40" y="0" width="180" height="120" rx="10" class="icon-bg"/>
    
    <!-- PCB Traces & Pads -->
    <circle cx="-15" cy="25" r="5" class="icon-primary" stroke-width="2"/>
    <circle cx="-15" cy="60" r="5" class="icon-primary" stroke-width="2"/>
    <circle cx="-15" cy="95" r="5" class="icon-primary" stroke-width="2"/>
    
    <circle cx="115" cy="25" r="5" class="icon-primary" stroke-width="2"/>
    <circle cx="115" cy="60" r="5" class="icon-primary" stroke-width="2"/>
    <circle cx="115" cy="95" r="5" class="icon-primary" stroke-width="2"/>

    <!-- LED Chips on Board -->
    <rect x="10" y="20" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>
    <rect x="40" y="20" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>
    <rect x="70" y="20" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>

    <rect x="10" y="50" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>
    <rect x="40" y="50" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>
    <rect x="70" y="50" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>

    <rect x="10" y="80" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>
    <rect x="40" y="80" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>
    <rect x="70" y="80" width="20" height="20" rx="3" class="icon-fill" opacity="0.85"/>

    <!-- Connecting Traces -->
    <path d="M -10 25 L 10 30 M 90 30 L 110 25" class="icon-primary" stroke-width="2"/>
    <path d="M -10 60 L 10 60 M 90 60 L 110 60" class="icon-primary" stroke-width="2"/>
    <path d="M -10 95 L 10 90 M 90 90 L 110 95" class="icon-primary" stroke-width="2"/>

    <!-- Mounting screw holes -->
    <circle cx="-30" cy="10" r="3" fill="#cbd5e1"/>
    <circle cx="130" cy="10" r="3" fill="#cbd5e1"/>
    <circle cx="-30" cy="110" r="3" fill="#cbd5e1"/>
    <circle cx="130" cy="110" r="3" fill="#cbd5e1"/>
  </g>

  <!-- Typography -->
  <text x="400" y="260" text-anchor="middle" class="title">Standard Dual-Channel LED Array Board</text>
  <text x="400" y="288" text-anchor="middle" class="subtitle">KiCad 3D Raytraced Render / Populated PCB Photograph (Front &amp; Back)</text>

  <!-- Source Reference Box -->
  <g transform="translate(180, 325)">
    <rect width="440" height="42" class="source-box"/>
    <text x="220" y="26" text-anchor="middle" class="source-text">Target asset: <tspan class="source-highlight">Hardware/LED_board/LED_board.step</tspan> or PCB photo</text>
  </g>
</svg>
