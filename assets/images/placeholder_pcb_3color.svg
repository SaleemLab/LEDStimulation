<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 16px; }
    .icon-bg { fill: #faf5ff; stroke: #e9d5ff; stroke-width: 1.5; }
    .icon-primary { stroke: #9333ea; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tag-bg { fill: #f3e8ff; rx: 6px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #7e22ce; letter-spacing: 0.08em; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    .source-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
    .source-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #64748b; }
    .source-highlight { fill: #7e22ce; font-weight: 600; }
  </style>

  <!-- Card Background -->
  <rect x="15" y="15" width="770" height="390" class="bg" filter="url(#shadow)" />

  <!-- Badge -->
  <g transform="translate(325, 45)">
    <rect width="150" height="26" class="tag-bg"/>
    <text x="75" y="17" text-anchor="middle" class="tag-text">IMAGE PLACEHOLDER</text>
  </g>

  <!-- Central Icon: 3-Channel PCB Wireframe -->
  <g transform="translate(350, 95)">
    <rect x="-40" y="0" width="180" height="120" rx="10" class="icon-bg"/>
    
    <!-- 3 Rows representing 3 Colours (Red, Green, Blue/UV) -->
    <!-- Row 1: Red -->
    <circle cx="-15" cy="25" r="5" stroke="#ef4444" stroke-width="2" fill="none"/>
    <rect x="15" y="18" width="18" height="14" rx="3" fill="#ef4444" opacity="0.9"/>
    <rect x="45" y="18" width="18" height="14" rx="3" fill="#ef4444" opacity="0.9"/>
    <rect x="75" y="18" width="18" height="14" rx="3" fill="#ef4444" opacity="0.9"/>
    <circle cx="115" cy="25" r="5" stroke="#ef4444" stroke-width="2" fill="none"/>
    <path d="M -10 25 L 15 25 M 33 25 L 45 25 M 63 25 L 75 25 M 93 25 L 110 25" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Row 2: Green -->
    <circle cx="-15" cy="60" r="5" stroke="#22c55e" stroke-width="2" fill="none"/>
    <rect x="15" y="53" width="18" height="14" rx="3" fill="#22c55e" opacity="0.9"/>
    <rect x="45" y="53" width="18" height="14" rx="3" fill="#22c55e" opacity="0.9"/>
    <rect x="75" y="53" width="18" height="14" rx="3" fill="#22c55e" opacity="0.9"/>
    <circle cx="115" cy="60" r="5" stroke="#22c55e" stroke-width="2" fill="none"/>
    <path d="M -10 60 L 15 60 M 33 60 L 45 60 M 63 60 L 75 60 M 93 60 L 110 60" stroke="#22c55e" stroke-width="1.5"/>

    <!-- Row 3: Blue / UV -->
    <circle cx="-15" cy="95" r="5" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <rect x="15" y="88" width="18" height="14" rx="3" fill="#3b82f6" opacity="0.9"/>
    <rect x="45" y="88" width="18" height="14" rx="3" fill="#3b82f6" opacity="0.9"/>
    <rect x="75" y="88" width="18" height="14" rx="3" fill="#3b82f6" opacity="0.9"/>
    <circle cx="115" cy="95" r="5" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <path d="M -10 95 L 15 95 M 33 95 L 45 95 M 63 95 L 75 95 M 93 95 L 110 95" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="400" y="260" text-anchor="middle" class="title">3-Colour LED Array Board (WIP)</text>
  <text x="400" y="288" text-anchor="middle" class="subtitle">KiCad 3D Layout Render / Schematic &amp; Routing Topology</text>

  <!-- Source Reference Box -->
  <g transform="translate(160, 325)">
    <rect width="480" height="42" class="source-box"/>
    <text x="240" y="26" text-anchor="middle" class="source-text">Target asset: <tspan class="source-highlight">Hardware/LED_board_humans/LED_board_humans.step</tspan></text>
  </g>
</svg>
