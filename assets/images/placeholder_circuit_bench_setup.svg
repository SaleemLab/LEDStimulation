<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 6; rx: 16px; }
    .icon-bg { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.5; }
    .tag-bg { fill: #ccfbf1; rx: 6px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f766e; letter-spacing: 0.08em; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #475569; }
    .source-box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 8px; }
    .source-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; fill: #64748b; }
    .source-highlight { fill: #0d9488; font-weight: 600; }
  </style>

  <!-- Card Background -->
  <rect x="15" y="15" width="770" height="390" class="bg" filter="url(#shadow)" />

  <!-- Badge -->
  <g transform="translate(325, 45)">
    <rect width="150" height="26" class="tag-bg"/>
    <text x="75" y="17" text-anchor="middle" class="tag-text">IMAGE PLACEHOLDER</text>
  </g>

  <!-- Central Icon: Breadboard & Bench Setup -->
  <g transform="translate(310, 95)">
    <!-- Breadboard / Proto-board Base -->
    <rect x="0" y="10" width="180" height="100" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    
    <!-- Breadboard Pin Holes Grid -->
    <g fill="#cbd5e1">
      <circle cx="20" cy="30" r="2"/><circle cx="35" cy="30" r="2"/><circle cx="50" cy="30" r="2"/><circle cx="65" cy="30" r="2"/><circle cx="80" cy="30" r="2"/><circle cx="95" cy="30" r="2"/><circle cx="110" cy="30" r="2"/><circle cx="125" cy="30" r="2"/><circle cx="140" cy="30" r="2"/><circle cx="155" cy="30" r="2"/>
      <circle cx="20" cy="45" r="2"/><circle cx="35" cy="45" r="2"/><circle cx="50" cy="45" r="2"/><circle cx="65" cy="45" r="2"/><circle cx="80" cy="45" r="2"/><circle cx="95" cy="45" r="2"/><circle cx="110" cy="45" r="2"/><circle cx="125" cy="45" r="2"/><circle cx="140" cy="45" r="2"/><circle cx="155" cy="45" r="2"/>
      <circle cx="20" cy="75" r="2"/><circle cx="35" cy="75" r="2"/><circle cx="50" cy="75" r="2"/><circle cx="65" cy="75" r="2"/><circle cx="80" cy="75" r="2"/><circle cx="95" cy="75" r="2"/><circle cx="110" cy="75" r="2"/><circle cx="125" cy="75" r="2"/><circle cx="140" cy="75" r="2"/><circle cx="155" cy="75" r="2"/>
      <circle cx="20" cy="90" r="2"/><circle cx="35" cy="90" r="2"/><circle cx="50" cy="90" r="2"/><circle cx="65" cy="90" r="2"/><circle cx="80" cy="90" r="2"/><circle cx="95" cy="90" r="2"/><circle cx="110" cy="90" r="2"/><circle cx="125" cy="90" r="2"/><circle cx="140" cy="90" r="2"/><circle cx="155" cy="90" r="2"/>
    </g>

    <!-- Transistor & Trimpot Components -->
    <!-- Transistor TO-92 -->
    <path d="M 40 50 A 10 10 0 0 1 60 50 Z" fill="#1e293b"/>
    <!-- Blue Cermet Trimpot -->
    <rect x="90" y="45" width="28" height="28" rx="3" fill="#2563eb"/>
    <circle cx="104" cy="59" r="6" fill="#fbbf24"/>
    <line x1="100" y1="59" x2="108" y2="59" stroke="#78350f" stroke-width="1.5"/>

    <!-- Jumper Wires -->
    <path d="M 20 45 Q 35 15 50 45" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 60 50 Q 80 20 104 45" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 118 60 Q 140 70 155 75" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="400" y="260" text-anchor="middle" class="title">Physical Circuit &amp; Driver Implementation</text>
  <text x="400" y="288" text-anchor="middle" class="subtitle">Photograph of Bench Prototype / Wiring Setup with Microcontroller &amp; Trimpots</text>

  <!-- Source Reference Box -->
  <g transform="translate(150, 325)">
    <rect width="500" height="42" class="source-box"/>
    <text x="250" y="26" text-anchor="middle" class="source-text">Target asset: Bench photo of Arduino + Transistor/Trimpot driver board</text>
  </g>
</svg>
