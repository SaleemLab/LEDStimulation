<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%">
  <defs>
    <!-- Simple Arrowhead for LED and Potentiometer -->
    <marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Clean schematic canvas -->
  <rect width="540" height="130" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <g stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Input Terminal & Pin Label -->
    <circle cx="45" cy="65" r="4" fill="#ffffff"/>
    <line x1="49" y1="65" x2="100" y2="65"/>

    <!-- Resistor 1: R_fixed (Zig-zag) -->
    <!-- path: (100,65) -> (105,65) -> (110,50) -> (120,80) -> (130,50) -> (140,80) -> (150,50) -> (160,80) -> (165,65) -> (170,65) -->
    <path d="M 100 65 L 108 65 L 114 53 L 124 77 L 134 53 L 144 77 L 154 53 L 160 65 L 170 65"/>

    <!-- Wire: R1 to Potentiometer -->
    <line x1="170" y1="65" x2="220" y2="65"/>

    <!-- Resistor 2: Variable Resistor / Rheostat (Zig-zag with arrow) -->
    <path d="M 220 65 L 228 65 L 234 53 L 244 77 L 254 53 L 264 77 L 274 53 L 280 65 L 290 65"/>
    <!-- Diagonal arrow through pot -->
    <line x1="230" y1="85" x2="282" y2="42" marker-end="url(#arr)"/>

    <!-- Wire: Pot to LED Anode -->
    <line x1="290" y1="65" x2="360" y2="65"/>

    <!-- LED Symbol -->
    <!-- Triangle -->
    <polygon points="360,50 360,80 384,65" fill="#1e293b"/>
    <!-- Cathode Bar -->
    <line x1="384" y1="50" x2="384" y2="80"/>
    <!-- Photon emission arrows -->
    <line x1="372" y1="48" x2="384" y2="34" marker-end="url(#arr)"/>
    <line x1="382" y1="48" x2="394" y2="34" marker-end="url(#arr)"/>

    <!-- Wire: LED Cathode to Ground -->
    <line x1="384" y1="65" x2="470" y2="65"/>
    <line x1="470" y1="65" x2="470" y2="90"/>

    <!-- Ground Symbol (GND) -->
    <line x1="455" y1="90" x2="485" y2="90"/>
    <line x1="460" y1="95" x2="480" y2="95"/>
    <line x1="465" y1="100" x2="475" y2="100"/>
  </g>

  <!-- Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <!-- Input label -->
    <text x="50" y="44" font-size="12" font-weight="600">PWM Source</text>

    <!-- R_fixed label -->
    <text x="135" y="38" font-size="12" font-weight="600">R<tspan dy="2" font-size="9">fixed</tspan></text>
    <text x="135" y="102" font-size="10" fill="#64748b">Current Limiter</text>

    <!-- R_var label -->
    <text x="255" y="34" font-size="12" font-weight="600">R<tspan dy="2" font-size="9">var</tspan></text>
    <text x="255" y="102" font-size="10" fill="#64748b">Cermet Trimpot</text>

    <!-- LED Load label -->
    <text x="372" y="24" font-size="12" font-weight="600">LED Load</text>

    <!-- Ground label -->
    <text x="470" y="118" font-size="11" font-weight="600">GND</text>
  </g>
</svg>
